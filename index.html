<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مقاضي البيت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [syncStatus, setSyncStatus] = React.useState('متزامن الآن مع الزوج/ة 🟢');

            // بيانات المخزون مع جعل needsShopping مبدئياً كلها false (الصفحة الرئيسية فارغة)
            const [inventory, setInventory] = React.useState([
                { id: 1, name: 'أرز (كيلو)', category: 'مطبخ جاف', stock: 2, unit: 'كيس', needsShopping: false },
                { id: 2, name: 'سكر', category: 'مطبخ جاف', stock: 1, unit: 'كيلو', needsShopping: false },
                { id: 3, name: 'حليب طازج', category: 'ثلاجة وفريزر', stock: 0, unit: 'عبوة', needsShopping: false },
                { id: 4, name: 'بيض', category: 'ثلاجة وفريزر', stock: 1, unit: 'طبق', needsShopping: false },
                { id: 5, name: 'معجون أسنان', category: 'عناية وحمام', stock: 1, unit: 'حبة', needsShopping: false },
                { id: 6, name: 'مناديل ورقية', category: 'عناية وحمام', stock: 1, unit: 'شدة', needsShopping: false },
                { id: 7, name: 'مسحوق غسيل', category: 'منظفات', stock: 0, unit: 'علبة', needsShopping: false },
            ]);

            const [newItemName, setNewItemName] = React.useState('');
            const [newItemCategory, setNewItemCategory] = React.useState('مطبخ جاف');
            const [newItemStock, setNewItemStock] = React.useState(1);
            const [newItemUnit, setNewItemUnit] = React.useState('حبة');

            // زيادة ونقصان الكمية
            const updateStock = (id, delta) => {
                setInventory(inventory.map(item => {
                    if (item.id === id) {
                        const newStock = Math.max(0, item.stock + delta);
                        return { ...item, stock: newStock };
                    }
                    return item;
                }));
            };

            // تبديل حالة الإضافة لقائمة النواقص يدوياً
            const toggleShoppingList = (id) => {
                setInventory(inventory.map(item => {
                    if (item.id === id) {
                        return { ...item, needsShopping: !item.needsShopping };
                    }
                    return item;
                }));
            };

            // إضافة منتج جديد
            const addItem = (e) => {
                e.preventDefault();
                if (!newItemName.trim()) return;
                const newItem = {
                    id: Date.now(),
                    name: newItemName,
                    category: newItemCategory,
                    stock: parseInt(newItemStock),
                    unit: newItemUnit,
                    needsShopping: false
                };
                setInventory([...inventory, newItem]);
                setNewItemName('');
                setActiveTab('inventory');
                alert('تمت إضافة المنتج بنجاح للمخزون!');
            };

            // قائمة النواقص المحددة يدوياً
            const shoppingList = inventory.filter(item => item.needsShopping);

            return (
                <div className="min-h-screen pb-12">
                    {/* شريط علوي */}
                    <header className="bg-emerald-600 text-white shadow-md p-4 sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-bold">🛒 تطبيق مقاضي البيت</h1>
                            <span className="text-xs bg-emerald-700 px-3 py-1 rounded-full">{syncStatus}</span>
                        </div>
                    </header>

                    {/* التنقل بين الصفحات */}
                    <nav className="bg-white shadow-sm border-b mb-6">
                        <div className="max-w-4xl mx-auto flex justify-around p-3">
                            <button 
                                onClick={() => setActiveTab('home')}
                                className={`font-medium pb-1 relative ${activeTab === 'home' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-slate-500'}`}>
                                الرئيسية والنواقص
                                {shoppingList.length > 0 && (
                                    <span className="absolute -top-2 -left-3 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">
                                        {shoppingList.length}
                                    </span>
                                )}
                            </button>
                            <button 
                                onClick={() => setActiveTab('inventory')}
                                className={`font-medium pb-1 ${activeTab === 'inventory' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-slate-500'}`}>
                                ستوك البيت الكامل
                            </button>
                            <button 
                                onClick={() => setActiveTab('add')}
                                className={`font-medium pb-1 ${activeTab === 'add' ? 'text-emerald-600 border-b-2 border-emerald-600' : 'text-slate-500'}`}>
                                إضافة منتج جديد
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto px-4">
                        {/* الصفحة الرئيسية: النواقص المحددة */}
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-6 shadow-sm text-center">
                                    <h2 className="text-xl font-bold text-amber-800 mb-2">🚨 قائمة التسوق المطلوبة</h2>
                                    <p className="text-sm text-amber-700 mb-4">الأغراض التي تحتاجون إحضارها من السوبرماركت بشكل عاجل:</p>
                                    
                                    {shoppingList.length === 0 ? (
                                        <div className="py-8">
                                            <p className="text-4xl mb-2">🎉</p>
                                            <p className="text-emerald-700 font-bold text-lg"> قائمة التسوق فارغة حالياً.</p>
                                            <p className="text-xs text-slate-500 mt-1">روحي على صفحة "ستوك البيت الكامل" واختاري أي غرض حابة تضيفيه للتسوق.</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3 text-right">
                                            {shoppingList.map(item => (
                                                <div key={item.id} className="bg-white p-3.5 rounded-lg flex justify-between items-center shadow-xs border">
                                                    <div>
                                                        <span className="font-bold text-slate-800">{item.name}</span>
                                                        <span className="text-xs text-slate-500 mr-2">({item.category})</span>
                                                        <div className="text-xs text-slate-400 mt-0.5">المتوفر حالياً: {item.stock} {item.unit}</div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <button 
                                                            onClick={() => toggleShoppingList(item.id)}
                                                            className="bg-slate-100 text-slate-600 text-xs px-2.5 py-1.5 rounded hover:bg-slate-200">
                                                            إزالة ❌
                                                        </button>
                                                        <button 
                                                            onClick={() => {
                                                                updateStock(item.id, 1);
                                                                toggleShoppingList(item.id);
                                                            }}
                                                            className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded hover:bg-emerald-700 font-medium">
                                                            تم الشراء ✅
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* صفحة الستوك الكامل مع زر التحكم */}
                        {activeTab === 'inventory' && (
                            <div className="bg-white rounded-xl shadow-sm p-5 border">
                                <h2 className="text-lg font-bold text-slate-800 mb-2">📦 جرد البيت الحالي</h2>
                                <p className="text-xs text-slate-500 mb-4">تقدري تتحكمي بالكميات، وكمان تضغطي على زر "أضف للنواقص" لأي غرض بدك ياه يظهر بالرئيسية.</p>
                                
                                <div className="space-y-4">
                                    {inventory.map(item => (
                                        <div key={item.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3.5 gap-3">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <h3 className="font-bold text-slate-700">{item.name}</h3>
                                                    {item.needsShopping && (
                                                        <span className="bg-red-100 text-red-700 text-[10px] px-2 py-0.5 rounded-full font-bold">مطلوب للتسوق</span>
                                                    )}
                                                </div>
                                                <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{item.category}</span>
                                            </div>

                                            <div className="flex items-center justify-between w-full sm:w-auto gap-4">
                                                {/* زر إضافة للنواقص يدوياً */}
                                                <button 
                                                    onClick={() => toggleShoppingList(item.id)}
                                                    className={`text-xs px-3 py-1.5 rounded-lg border transition ${item.needsShopping ? 'bg-red-50 text-red-600 border-red-200 font-bold' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}>
                                                    {item.needsShopping ? 'إزالة من النواقص 🛑' : '🛒 أضف للنواقص'}
                                                </button>

                                                {/* عداد الكمية */}
                                                <div className="flex items-center gap-2">
                                                    <button onClick={() => updateStock(item.id, -1)} className="w-7 h-7 bg-slate-200 rounded-full font-bold hover:bg-slate-300 text-sm">-</button>
                                                    <span className="font-bold w-14 text-center text-sm">{item.stock} {item.unit}</span>
                                                    <button onClick={() => updateStock(item.id, 1)} className="w-7 h-7 bg-emerald-100 text-emerald-700 rounded-full font-bold hover:bg-emerald-200 text-sm">+</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* صفحة إضافة منتج جديد */}
                        {activeTab === 'add' && (
                            <div className="bg-white rounded-xl shadow-sm p-6 border max-w-lg mx-auto">
                                <h2 className="text-lg font-bold text-slate-800 mb-4">➕ إضافة صنف جديد للمقاضي</h2>
                                <form onSubmit={addItem} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">اسم المنتج:</label>
                                        <input 
                                            type="text" 
                                            value={newItemName}
                                            onChange={(e) => setNewItemName(e.target.value)}
                                            placeholder="مثال: شامبو، طحين، مناديل..." 
                                            className="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">القسم:</label>
                                        <select 
                                            value={newItemCategory}
                                            onChange={(e) => setNewItemCategory(e.target.value)}
                                            className="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none">
                                            <option value="مطبخ جاف">مطبخ جاف</option>
                                            <option value="ثلاجة وفريزر">ثلاجة وفريزر</option>
                                            <option value="عناية وحمام">عناية وحمام</option>
                                            <option value="منظفات">منظفات البيت</option>
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">الكمية الحالية:</label>
                                            <input 
                                                type="number" 
                                                min="0"
                                                value={newItemStock}
                                                onChange={(e) => setNewItemStock(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">وحدة القياس:</label>
                                            <select 
                                                value={newItemUnit}
                                                onChange={(e) => setNewItemUnit(e.target.value)}
                                                className="w-full border rounded-lg p-2.5 outline-none">
                                                <option value="حبة">حبة</option>
                                                <option value="كيس">كيس</option>
                                                <option value="كيلو">كيلو</option>
                                                <option value="عبوة">عبوة</option>
                                                <option value="شدة">شدة</option>
                                                <option value="طبق">طبق</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-bold hover:bg-emerald-700 transition">
                                        حفظ وإضافة للمخزون
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
